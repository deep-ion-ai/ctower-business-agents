[package]
name = "cba-repos"
description = "Repositório de código (forja) e de issues (rastreador) de um projeto: modelo, validação, credencial e prontidão"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
