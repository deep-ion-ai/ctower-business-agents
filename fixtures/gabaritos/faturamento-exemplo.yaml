      - frontend/src/telas/parcelamento-form.ts
      - db/01_tabelas.sql
      - db/02_parametros.sql

  # Demanda que toca a tabela de clientes (#126): dados pessoais e requisitos
  # não funcionais na análise de impacto.
  - id: D-FAT-004
    texto: >-
      Incluir o nome, o CPF e o e-mail do cliente no arquivo de cobrança gerado
      pelo lote mensal, para a empresa de cobrança terceirizada enviar os avisos
      de atraso. É só acrescentar os campos no arquivo.
    premissa: >-
      Não basta acrescentar os campos: o lote de cobrança COBOL lê um arquivo
      de faturas vencidas que só traz o id da fatura, o tipo de cliente, a
      isenção, o valor e os dias de atraso, sem o cliente; a extração que gera
      esse arquivo não está no projeto. O "CPF" é a coluna DOCUMENTO, que guarda
      CPF só para pessoa física (CNPJ para PJ e órgão público), e o e-mail fica
      em outra tabela (CLIENTE_CONTATO), opcional, com o indicador
      ACEITA_AVISO. Nome, CPF e e-mail são dados pessoais que passam a sair para
      um terceiro; o lote não registra log do que envia.
