      - db/01_tabelas.sql
      - db/05_cliente_contato.sql

  # Demanda que trata como defeito uma regra criada de propósito por uma
  # demanda anterior (#450). A cópia da fixture recebe o histórico git
  # sintético de fixtures/historicos/faturamento-exemplo, em que o commit
  # "[DEM-12] Impedir o cancelamento de fatura com pagamento parcial" criou o
  # ramo da RN-FAT-012. A análise deve achar a DEM-12 pelo histórico do trecho,
  # citá-la em "Como é hoje" e perguntar se a regra continua valendo.
  - id: D-FAT-005
    texto: >-
      Erro no cancelamento de fatura: o sistema recusa cancelar uma fatura que
      já recebeu pagamento parcial, com a mensagem "Fatura com pagamento parcial
      nao pode ser cancelada". O cliente desistiu do serviço e a fatura precisa
      ser cancelada. Corrigir para permitir o cancelamento.
    premissa: >-
      Não é defeito: a recusa foi criada de propósito pela demanda DEM-12
      ("Impedir o cancelamento de fatura com pagamento parcial"), porque o
      valor pago ficaria sem destino. Permitir o cancelamento revoga a
      RN-FAT-012 e exige decidir o que fazer com o valor já pago (estorno ou
      compensação).
    abrangencia_esperada: pequena
    regras: [RN-FAT-012]
    origem:
      historico: faturamento-exemplo
      chave: DEM-12
      regra: RN-FAT-012
    verificacao_da_premissa:
      veredito: nao_confere
      palavras_chave: [[defeito, erro, bug, falha, "de proposito", intencional*, proposital*], [dem-12, demanda, regra, pagamento, pago, parcial]]
    perguntas_esperadas:
      - tema: A regra da DEM-12, que impede cancelar fatura com pagamento parcial, continua valendo?
        palavras_chave: [[dem-12], [continua*, vale, valendo, vigente, mant*, revog*, substitu*]]
      - tema: Cancelada a fatura com pagamento parcial, o que acontece com o valor já pago?
        palavras_chave: [[pago, pagamento, valor, vl_pago], [estorn*, devol*, credit*, compens*, reembols*, destino]]
    # Decisão para o negócio (#452): manter ou revogar a regra da DEM-12 é escolha
    # do negócio, com o efeito de cada opção, e abre o documento.
    decisoes_esperadas:
      - tema: Manter ou revogar a regra da DEM-12, que impede cancelar fatura com pagamento parcial?
        palavras_chave: [[dem-12, regra, cancel*], [continua*, vale, valendo, vigente, mant*, revog*, permit*]]
    arquivos_impactados:
      - db/03_pkg_cobranca.sql

  # Demanda sobre um estado errado (#451): o solicitante culpa uma "rota
  # antiga" que não existe. Três caminhos gravam CANCELADA: a tela da
  # retaguarda (PRC_CANCELAR_FATURA) e o portal validam; a edição do cliente,
  # ao desligá-lo, chama o mesmo método do portal com a validação desligada. A
  # análise deve listar os três e apontar o que não valida.
  - id: D-FAT-006
    texto: >-
      Há faturas com pagamento parcial na situação CANCELADA, e o valor pago
      ficou sem destino. O cancelamento pela tela e pelo portal recusa fatura
      com pagamento parcial, então essas faturas devem ter sido canceladas pela
      rota antiga de cancelamento, que não valida. Desativar a rota antiga.
    premissa: >-
      Não há rota antiga de cancelamento. A tela da retaguarda
      (PRC_CANCELAR_FATURA) e o portal (POST /api/faturas/{id}/cancelamento)
      recusam fatura com pagamento parcial. O caminho que cancela sem validar é
      a edição do cliente: ao desligar o cliente (PUT /api/clientes/{id}),
      ClienteService.editar cancela as faturas ABERTA dele chamando
      CancelamentoService.cancelar com a validação desligada, inclusive as que
      têm pagamento parcial. As faturas já canceladas assim precisam de
      tratamento (estorno ou compensação do valor pago).
    abrangencia_esperada: media
    regras: [RN-FAT-012, RN-FAT-017, INC-FAT-004]
    verificacao_da_premissa:
      veredito: nao_confere
      palavras_chave: [[antiga, "nao existe", "nao ha", inexist*, nenhuma], [cliente, deslig*, clienteservice]]
    caminhos_de_escrita:
      estado: FATURA.STATUS = CANCELADA
      caminhos:
        - nome: Tela de cancelamento da retaguarda (PKG_COBRANCA.PRC_CANCELAR_FATURA)
          valida: true
          palavras_chave: [[prc_cancelar_fatura, frmcancelamento, retaguarda, delphi]]
          evidencias:
            - arquivo: db/03_pkg_cobranca.sql
              linha_inicial: 123
              linha_final: 127
              trecho: "SET STATUS          = 'CANCELADA'"
            - arquivo: delphi/UFrmCancelamento.pas
              linha_inicial: 94
              linha_final: 94
              trecho: "PRC_CANCELAR_FATURA"
        - nome: Cancelamento pelo portal (POST /api/faturas/{id}/cancelamento)
          valida: true
          palavras_chave: [[portal, faturacontroller, "api/faturas"]]
          evidencias:
            - arquivo: backend/src/main/java/exemplo/faturamento/FaturaController.java
              linha_inicial: 23
              linha_final: 28
              trecho: "cancelamentoService.cancelar(id, pedido.motivo(), usuario, true)"
        - nome: Edição do cliente, ao desligá-lo (PUT /api/clientes/{id})
          valida: false
          palavras_chave: [[deslig*, clienteservice, clientecontroller, "edicao do cliente", "api/clientes"]]
          evidencias:
            - arquivo: backend/src/main/java/exemplo/faturamento/ClienteService.java
              linha_inicial: 44
              linha_final: 49
              trecho: "cancelamentoService.cancelar(idFatura, MOTIVO_DESLIGAMENTO, usuario, false)"
          sem_validacao: [[valid*, verific*, checag*, confer*, recus*], [sem, nao, desligad*, ignor*, pul*, false, nenhum*]]
    perguntas_esperadas:
      - tema: Ao desligar o cliente, o que fazer com a fatura que já recebeu pagamento parcial?
        palavras_chave: [[deslig*, cliente], [pago, pagamento, parcial, vl_pago], [estorn*, devol*, credit*, compens*, cancel*, mant*, aberta]]
      - tema: O que fazer com as faturas com pagamento parcial já canceladas pelo desligamento?
        palavras_chave: [[cancelad*, "ja cancel*"], [estorn*, devol*, credit*, compens*, reabr*, corrig*, trat*]]
    arquivos_impactados:
      - backend/src/main/java/exemplo/faturamento/ClienteService.java
      - backend/src/main/java/exemplo/faturamento/CancelamentoService.java

