# Papéis das pessoas nas reuniões do projeto.
#
# O app sugere estes papéis na confirmação dos participantes de uma reunião. O
# analista também pode digitar um papel que não está aqui (texto livre).
#
# Como editar:
# - um item por papel, com `nome` (curto: até 40 caracteres e 5 palavras, sem
#   `?`, `!`, `;`, `:`, aspas nem `@`) e, se quiser, uma `descricao` para a tela;
# - para voltar ao padrão, apague este arquivo: o app grava a cópia de novo.
papeis:
  - nome: PO
    descricao: Dono do produto; prioriza e aceita as entregas.
  - nome: gerente/patrocinador
    descricao: Responde pelo projeto no cliente e decide sobre prazo e custo.
  - nome: analista de negócio
    descricao: Levanta e documenta as necessidades e as regras de negócio.
  - nome: usuário-chave
    descricao: Usa o processo no dia a dia e conhece as exceções.
  - nome: desenvolvedor
    descricao: Implementa as mudanças no código.
  - nome: arquiteto
    descricao: Decide a solução técnica e as integrações.
  - nome: QA
    descricao: Testa e homologa as entregas.
  - nome: cliente externo
    descricao: Pessoa do cliente de fora da equipe do projeto.
