sha2 = "0.10"
# Diff de linhas do aviso de alteração (#29).
similar = "2"
serde_json.workspace = true
thiserror = "2"
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
