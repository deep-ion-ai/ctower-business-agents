[package]
name = "cba-app"
description = "App desktop (Tauri) e executável multimodo do ctower-business-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# O executável é um só: sem argumentos abre a janela; `cba mcp` e `cba hook <evento>`
# atendem os clientes de IA sem inicializar o Tauri (spec, seção 5).
[[bin]]
name = "cba"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cba-core.workspace = true
cba-mcp.workspace = true
cba-session.workspace = true
cba-tools.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
cba-index.workspace = true
cba-kb.workspace = true
serde_norway.workspace = true
tempfile = "3"
toml = "0.9"
