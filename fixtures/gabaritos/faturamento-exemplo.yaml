          palavras_chave: [[documento, cpf]]
          evidencias:
            - arquivo: db/01_tabelas.sql
              linha_inicial: 10
              linha_final: 10
              trecho: "DOCUMENTO         VARCHAR2(18)"
            - arquivo: db/02_parametros.sql
              linha_inicial: 23
              linha_final: 23
              trecho: "'000.000.000-00', 'PF'"
        - campo: CLIENTE_CONTATO.EMAIL
          categoria: contato
          palavras_chave: [[email, "e-mail"]]
          evidencias:
            - arquivo: db/05_cliente_contato.sql
              linha_inicial: 8
              linha_final: 8
              trecho: "EMAIL             VARCHAR2(120)"
      # Colunas que a demanda toca ou que estão ao lado dos campos pessoais, mas
      # não guardam dado pessoal: apontá-las como dado pessoal é falso positivo.
      nao_pessoais:
        - campo: CLIENTE.TIPO_CLIENTE
          palavras_chave: [[tipo_cliente]]
        - campo: CLIENTE.ISENTO_ENCARGOS
          palavras_chave: [[isento_encargos]]
        - campo: CLIENTE_CONTATO.ACEITA_AVISO
          palavras_chave: [[aceita_aviso]]
      aspectos:
        - aspecto: auditoria
          tema: O lote não registra em log o que envia ao terceiro (só exibe contadores).
          palavras_chave: [[log*, auditor*, rastr*, registr*, trilha*], [lote, calcobr*, arquivo, envi*, compartilh*, terceir*]]
        - aspecto: desempenho
          tema: O lote mensal passa a ler o cliente e o contato de cada fatura vencida.
          palavras_chave: [[lote, calcobr*, mensal, extra*, fatvenc], [volume, janela, desempenho, tempo, join*, leitura*, quantidade]]
        - aspecto: acesso
          tema: Quem recebe e acessa o arquivo com dados pessoais fora do projeto.
          palavras_chave: [[acesso, perfil*, permiss*, quem, controle], [arquivo, terceir*, empresa, cobranca]]
    perguntas_esperadas:
      - tema: Há contrato ou base legal (LGPD) para compartilhar nome, CPF e e-mail com a empresa terceirizada?
        palavras_chave: [[terceir*, "empresa de cobranca", compartilh*, envi*], [lgpd, contrato, "base legal", consentimento, autoriz*, finalidade, "dados pessoais"]]
      - tema: Para pessoa jurídica e órgão público, o documento é CNPJ; vai também no arquivo?
        palavras_chave: [[cnpj, pj, "pessoa juridica", pub, "orgao publico"]]
      - tema: Cliente sem e-mail cadastrado ou que não aceita avisos (ACEITA_AVISO) entra no arquivo?
        palavras_chave: [[email, "e-mail", aceita_aviso, aviso*], [sem, vazio, nulo, null, ausente, opcional, aceit*, consentimento, "nao aceita"]]
      - tema: Onde é gerado o arquivo de faturas vencidas que o lote lê, e qual o volume e a janela do lote?
        palavras_chave: [[fatvenc, extra*, "arquivo de faturas", entrada, volume, janela], [onde, quem, fora, externo, job, gera*, quant*, horario, tempo, quantos]]
    arquivos_impactados:
