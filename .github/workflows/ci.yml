name: ci

on:
  pull_request:
  # Sem `wip/**`: cada merge numa wip já passou pelo CI do PR, atualizado com a base.
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo PR ou branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide quais jobs rodam, um output por área, em qualquer PR (inclusive para
  # develop e main). Push em develop ou main e execução manual rodam tudo, e um PR
  # que mexe em .github/workflows/** também. O diff é contra a base do PR, sem ação
  # de terceiros:
  #   rust       crates/, ui/ (o cba-app embute ui/dist), fixtures/, Cargo.toml,
  #              Cargo.lock, rust-toolchain.toml
  #   ui         ui/
  #   politicas  crates/, ui/, fixtures/, scripts/, Cargo.*, rust-toolchain.toml e os
  #              arquivos de versão (release-please-config.json e o manifest)
  #   instaladores  packaging/
  #   codigo     false só no PR de back-merge da release (head main, base develop)
  #              cujos arquivos são todos gerados pelo release-please (lista fechada
  #              abaixo). Eles já passaram pelo CI no PR da release e no push para
  #              main, e o push na develop depois do merge roda tudo de novo. Então
  #              rust, ui e instaladores são pulados; `politicas` e `ci-ok` seguem.
  #              Qualquer outro arquivo (ex.: hotfix na main) volta ao CI completo.
  # PR só de docs/, *.md da raiz, LICENSE e afins não roda nenhum deles; `titulo`,
  # CLA e `ci-ok` continuam.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filtro.outputs.rust }}
      ui: ${{ steps.filtro.outputs.ui }}
      politicas: ${{ steps.filtro.outputs.politicas }}
      codigo: ${{ steps.filtro.outputs.codigo }}
      instaladores: ${{ steps.filtro.outputs.instaladores }}
    steps:
      # Em PR o checkout traz o merge commit de teste; o primeiro pai é a base.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" != pull_request ]; then
            alterados=
            tudo=true
          else
            alterados=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$alterados"
            tudo=false
            if printf '%s\n' "$alterados" | grep -Eq '^\.github/workflows/'; then tudo=true; fi
          fi
          # Back-merge da release: só arquivos gerados pelo release-please.
          codigo=true
          if [ "$EVENTO" = pull_request ] && [ "$HEAD_REF" = main ] && [ "$BASE_REF" = develop ] \
            && [ -n "$alterados" ] \
            && ! printf '%s\n' "$alterados" | grep -Evq '^(\.release-please-manifest\.json|CHANGELOG\.md|Cargo\.toml|Cargo\.lock|ui/package\.json|ui/package-lock\.json|ui/src-tauri/tauri\.conf\.json)$'; then
            codigo=false
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          # area NOME REGEX: true se roda tudo ou algum arquivo alterado casa.
          area() {
            if [ "$tudo" = true ] || printf '%s\n' "$alterados" | grep -Eq "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          area rust '^(crates/|ui/|fixtures/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$)'
          area ui '^ui/'
          area politicas '^(crates/|ui/|fixtures/|scripts/|Cargo\.|rust-toolchain\.toml$|release-please-config\.json$|\.release-please-manifest\.json$)'
          area instaladores '^packaging/'

  rust:
    needs: mudancas
    if: needs.mudancas.outputs.rust == 'true' && needs.mudancas.outputs.codigo == 'true'
    strategy:
      # Um sistema que falha não cancela os outros.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Instala a versão fixada no rust-toolchain.toml, com rustfmt e clippy.
      - name: Toolchain do rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      # Bibliotecas de sistema que o Tauri 2 usa no Linux (webview e ícones).
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # O cba-app embute ui/dist no binário (generate_context! exige a pasta), então a
      # UI é construída antes do clippy e dos testes.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Construir a UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Frontend do app: tipos, testes de componentes e build do Vite.
  ui:
    needs: mudancas
    if: needs.mudancas.outputs.ui == 'true' && needs.mudancas.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Regras do repositório que não dependem do sistema operacional.
  politicas:
    needs: mudancas
    if: needs.mudancas.outputs.politicas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain do rust-toolchain.toml
        run: rustup toolchain install
      - name: Testes dos scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Mesma versão em todos os arquivos de versão (lista nos extra-files do
      # release-please-config.json) e no Cargo.lock.
      - name: Versões
        run: python3 scripts/check-versions.py
      # Só o cba-app depende do Tauri (spec, seção 5).
      - name: Nenhuma crate além do cba-app depende do Tauri
        run: python3 scripts/check-deps.py
      # A entidade cadastrada se chama projeto (#95); "sistema" só para o software.
      - name: Termo "projeto" nos nomes do código
        run: python3 scripts/check-termos.py

  # Scripts de instalação (#45): análise estática e testes com uma release falsa
  # (sem instalar nada; veja packaging/tests).
  instalador-sh:
    needs: mudancas
    if: needs.mudancas.outputs.instaladores == 'true' && needs.mudancas.outputs.codigo == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh packaging/install/install.sh
      - run: sh -n packaging/install/install.sh
      - name: Testes com sh
        run: python3 -m unittest discover -v -s packaging/tests -p 'test_*.py'
      - name: Testes com dash
        if: runner.os == 'Linux'
        run: CBA_TEST_SH=dash python3 -m unittest discover -s packaging/tests -p 'test_*.py'

  instalador-ps1:
    needs: mudancas
    if: needs.mudancas.outputs.instaladores == 'true' && needs.mudancas.outputs.codigo == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $r = 'packaging/install/install.ps1', 'packaging/tests/test-install.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost }
          $r | Format-Table -AutoSize -Wrap RuleName, Line, Message
          if ($r) { exit 1 }
      - name: Testes com PowerShell 5.1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/tests/test-install.ps1 -Shell powershell
      - name: Testes com PowerShell 7
        run: pwsh -NoProfile -File packaging/tests/test-install.ps1 -Shell pwsh

  # Check obrigatório da develop e da main. Sempre roda e falha só se algum job
  # falhou ou foi cancelado; job pulado (área que o PR não tocou) conta como sucesso.
  ci-ok:
    if: always()
    needs: [mudancas, rust, ui, politicas, instalador-sh, instalador-ps1]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Algum job terminou com '$r'."; exit 1 ;;
            esac
          done
