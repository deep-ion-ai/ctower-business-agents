[package]
name = "cba-repos"
description = "Repositório de código (forja) e de issues (rastreador) de um projeto: modelo, validação, credencial e prontidão"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
zeroize = "1"
# Tokens no chaveiro do sistema (#179): Keychain no macOS, Gerenciador de
# Credenciais no Windows, keyutils no Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
regex = "1.13.1"
# Id do blob do git (#276): compara o conteúdo publicado sem ler cada arquivo.
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
dunce = "1"
