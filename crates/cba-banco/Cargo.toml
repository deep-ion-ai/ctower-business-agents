[package]
name = "cba-banco"
description = "Acesso só de leitura a bancos PostgreSQL e MySQL/MariaDB: validação da instrução, consulta, prontidão e introspecção do schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cba-core.workspace = true
cba-repos.workspace = true
cba-sql.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
tracing.workspace = true
# Driver nativo, sem cliente instalado na máquina. Sem as macros (consultas
# conferidas em tempo de compilação) e sem SQLite: o app só lê bancos externos.
# `mysql-rsa`: senha do MySQL 8 (caching_sha2_password) com o TLS desligado.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "mysql", "mysql-rsa", "runtime-tokio", "tls-rustls"] }
# Runtime só desta crate: a API é síncrona, como a das ferramentas.
tokio = { version = "1", features = ["rt", "time", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
