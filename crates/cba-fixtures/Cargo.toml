[package]
name = "cba-fixtures"
description = "Testes de integridade das fixtures (sistemas fictícios e gabaritos)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Crate só de testes: o código está em tests/. A lib vazia existe porque o
# Cargo exige ao menos um alvo além dos testes de integração.
[lib]
path = "src/lib.rs"
test = false
doctest = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway.workspace = true
