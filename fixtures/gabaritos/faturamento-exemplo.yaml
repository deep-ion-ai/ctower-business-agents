# Gabarito do sistema fictício "Faturamento Exemplo".
#
# Este arquivo NÃO faz parte do sistema analisado: ele fica fora da pasta
# fixtures/faturamento-exemplo/ de propósito, para que nenhuma ferramenta
# que cadastre aquela pasta como projeto leia as respostas.
#
# Convenções:
# - `raiz` é a pasta do projeto, relativa a este arquivo.
# - `arquivo` é sempre relativo à raiz do projeto, com `/` como separador.
# - `linha_inicial` e `linha_final` são inclusivas, contadas a partir de 1.
# - `trecho` é um texto curto que precisa aparecer dentro do intervalo
#   (o mesmo papel do "trecho citado" de uma evidência, spec seção 6.5).
# - Regras citadas por perguntas, funcionalidades e demandas usam os ids
#   de `regras` ou de `inconsistencias`.
# - Ao editar a fixture, atualize as linhas aqui; o teste da crate
#   cba-fixtures confere tudo.
# - `perguntas_esperadas` (perguntas, funcionalidades e demandas) lista o que o
#   código não responde e o agente deve perguntar ao solicitante. Cada uma tem
#   um `tema` (para quem lê o relatório) e `palavras_chave`: uma lista de
#   grupos; uma pergunta registrada atende quando cada grupo tem ao menos um
#   termo no texto. A comparação ignora maiúsculas e acentos; o termo casa
#   com a palavra inteira, ou com o começo dela quando termina em `*`.
# - `verificacao_da_premissa` (demandas) diz como o agente deve julgar a
#   suposição do solicitante, na seção "Demanda como entendida": `veredito`
#   (`nao_confere` ou `confere_em_parte`) e `palavras_chave`, no mesmo formato.
# - `caminhos_de_escrita` (demandas, #451) lista todos os caminhos que gravam o
#   `estado` de que a demanda trata: cada um com `nome`, se `valida` o estado
#   antes de gravar, `palavras_chave` e `evidencias`. Um caminho é citado por
#   uma afirmação com as palavras-chave ou com evidência que toca uma das
#   esperadas; o que não valida precisa aparecer numa afirmação de `riscos` ou
#   `funcionalidades` que o cite e tenha as palavras-chave de `sem_validacao`.
# - `dados_pessoais` (demandas, #126) descreve a seção "Dados pessoais e
#   requisitos não funcionais" esperada: os `campos` com dado pessoal que a
#   demanda toca (`campo` TABELA.COLUNA, `categoria`, `palavras_chave` e as
#   `evidencias` da definição ou do conteúdo da coluna), as colunas
#   `nao_pessoais` (apontá-las como dado pessoal é falso positivo) e os
#   `aspectos` não funcionais (auditoria, desempenho, acesso) com as
#   `palavras_chave` que uma afirmação da seção ou uma pergunta deve ter.
# - `reunioes` (fluxo "Analisar reunião", #137) descreve a ata esperada de cada
#   transcript de fixtures/reunioes/: o papel de cada participante (`nome` como
#   aparece no transcript, `papel` do catálogo padrão e, se houver, outros
#   papéis aceitos em `tambem_aceitos`) e os itens esperados por seção (`tipo`:
#   decisao, necessidade, regra, pendencia, duvida ou proximo_passo). Um item
#   registrado atende quando é do `tipo` (ou de um dos `tambem_em`) e o texto
#   tem um termo de cada grupo de `palavras_chave`. Nas pendências,
#   `responsavel` e `prazo` são grupos de termos conferidos nos campos do item.
#   `falas` lista o início (M:SS) das falas que sustentam o item, para conferir
#   se o agente citou a fala certa. `transcript` é relativo a este arquivo.
# - `revisoes` (fluxo "Revisar requisito", #116) traz requisitos e histórias
#   fictícios com problemas plantados e o parecer esperado: o `veredito`
#   (pronta, pronta_com_ressalvas ou precisa_de_retrabalho), os
#   `termos_vagos` da lista de referência (cba_core::qualidade) que devem ser
#   apontados e os `achados` esperados. Um achado registrado atende quando é
#   da `caracteristica` (ou de uma das `tambem_em`), tem um termo de cada grupo
#   de `palavras_chave` no trecho, no problema ou na reescrita e, se o esperado
#   cita `regras`, tem evidência válida que toca uma evidência esperada de uma
#   delas (ou cita a regra pelo id).
# - `historias` (fluxo "Histórias e critérios", #115) traz as histórias
#   esperadas a partir da análise de impacto de uma `demanda`: as `regras` que
#   os critérios devem citar (pelo id ou por uma afirmação cuja evidência toca
#   a regra), se a abrangência pede a `quebra` em fatias, as
#   `historias_esperadas` (palavras-chave no título e na narrativa "Como /
#   quero / para") e os temas que devem ficar `a_confirmar` (critério com
#   pergunta; palavras-chave no Dado / Quando / Então). O preparo da avaliação
#   cria a análise de origem com uma afirmação confirmada por regra da demanda
#   e uma pergunta em aberto por pergunta esperada dela.
# - `cenarios` (fluxo "Cenários de teste", #117) traz os cenários esperados a
#   partir das `regras` pedidas (o preparo da avaliação grava as regras na base
#   e cria a análise de cenários com o `pedido`): os `limites` que o agente deve
#   ler do código (o `valor` aparece no `trecho` da `evidencia`, conferido contra
#   a fixture; `valores_testados` são o limite e o vizinho do outro lado da
#   comparação), as `tabelas` de decisão esperadas (regra, número mínimo de
#   condições e palavras-chave nas condições), os cenários `negativos` (com as
#   palavras-chave no título e nos passos) e os temas `a_confirmar` (limite que
#   vem de tabela de parâmetros, com pergunta).
# - `ciclos_vida` (ciclo de vida de uma entidade, #119) traz o diagrama de
#   estados esperado de uma entidade com campo de status: o `campo` (com a
#   evidência da definição), os `estados` pelo valor gravado no código (com o
#   inicial e os finais), as `transicoes` (de, para, palavras-chave no evento ou
#   na condição e a evidência da rotina que grava o campo) e os `achados` que o
#   app deve apontar (`inalcancavel`: nenhuma transição chega ao estado;
#   `sem_saida`: estado não final de que nenhuma transição sai). A análise é do
#   fluxo explicar, com o `pedido` como entrada.
# - `processo` e `modelo_dados` (funcionalidades, fluxo "explicar", #120)
#   descrevem os diagramas esperados no documento negocial. `processo`: as
#   `raias` (atores; palavras-chave na raia de algum passo), os passos do
#   `principal` e as `decisoes` dos fluxos alternativos e das exceções. Um passo
#   atende quando tem as palavras-chave no rótulo ou na descrição ou cita uma
#   evidência que toca uma das `evidencias` esperadas; a decisão, quando o nó é
#   de decisão e atende do mesmo jeito. `modelo_dados`: as `entidades` (pela
#   `tabela`; o nome de negócio com as palavras-chave) e as `relacoes` entre
#   tabelas, com a `origem` esperada (`chave_estrangeira`, declarada nos
#   scripts, ou `join`, sem chave estrangeira, que precisa sair como inferida).
#   Relação `opcional` não conta na cobertura, mas, se registrada, precisa ter a
#   origem esperada.
# - `mapeamentos` (mapa de funcionalidades do projeto, #208) traz o mapa
#   esperado do projeto inteiro: os `pontos_de_entrada` que o app acha no mapa
#   estrutural (cba_index::Mapa::pontos_de_entrada, pela chave
#   `<arquivo>#<nome qualificado>`), cada um com as `funcionalidades` a que pode
#   ser atribuído (ids deste gabarito) e, se for ajudante, `justificavel: true`
#   (pode ficar como utilitário, sem funcionalidade); e as `funcionalidades`
#   esperadas no mapa: as de `funcionalidades` (pelo id) e as que só o
#   mapeamento cobre, com o `nome`, a `area` e as `palavras_chave` no nome ou na
#   descrição. Uma funcionalidade registrada atende quando tem as palavras-chave
#   e ao menos um ponto de entrada esperado dela.
# - A avaliação dos fluxos (crate cba-avaliacao, docs/avaliacao.md) usa este
#   arquivo como referência.

projeto: faturamento-exemplo
raiz: ../faturamento-exemplo

regras:
  - id: RN-FAT-001
    titulo: Multa por atraso vem de parâmetro
    area: cobranca
    enunciado: >-
      Passada a carência, a fatura em atraso recebe multa única de
      PERC_MULTA_ATRASO por cento (hoje 2%) sobre o valor original,
      lida da tabela PARAMETRO e arredondada em 2 casas.
    evidencias:
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 71
        linha_final: 72
        trecho: "FN_PARAMETRO('PERC_MULTA_ATRASO') / 100, 2)"
      - arquivo: db/02_parametros.sql
        linha_inicial: 6
        linha_final: 7
        trecho: "'PERC_MULTA_ATRASO', 2.0000"

  - id: RN-FAT-002
    titulo: Juros de mora desde o primeiro dia de atraso
    area: cobranca
    enunciado: >-
      Passada a carência, os juros de mora são simples, de PERC_JUROS_DIA
      por cento ao dia (hoje 0,033%) sobre o valor original, e contam desde
      o primeiro dia após o vencimento, não só a partir do fim da carência.
    evidencias:
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 94
        linha_final: 96
        trecho: "FN_PARAMETRO('PERC_JUROS_DIA') / 100 * V_DIAS"
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 47
        linha_final: 47
        trecho: "RETURN TRUNC(P_DT_REFERENCIA) - TRUNC(P_DT_VENCIMENTO)"
      - arquivo: db/02_parametros.sql
        linha_inicial: 9
        linha_final: 10
        trecho: "'PERC_JUROS_DIA', 0.0330"

  - id: RN-FAT-003
    titulo: Carência de 3 dias sem encargos
    area: cobranca
    enunciado: >-
      Atraso de até DIAS_CARENCIA dias corridos (hoje 3) não gera multa nem
      juros. A partir do quarto dia, multa e juros são cobrados.
    evidencias:
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 66
        linha_final: 69
        trecho: "IF V_DIAS <= FN_PARAMETRO('DIAS_CARENCIA') THEN"
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 90
        linha_final: 92
        trecho: "IF V_DIAS <= FN_PARAMETRO('DIAS_CARENCIA') THEN"
      - arquivo: db/02_parametros.sql
        linha_inicial: 12
        linha_final: 13
        trecho: "'DIAS_CARENCIA', 3.0000"

  - id: RN-FAT-004
    titulo: Cliente com isenção cadastrada não paga encargos
    area: cobranca
    enunciado: >-
      Cliente com CLIENTE.ISENTO_ENCARGOS = 'S' não paga multa nem juros,
      seja qual for o tipo de cliente.
    evidencias:
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 59
        linha_final: 62
        trecho: "IF V_CLIENTE.ISENTO_ENCARGOS = 'S' THEN"
      - arquivo: db/03_pkg_cobranca.sql
        linha_inicial: 84
        linha_final: 86
        trecho: "IF V_CLIENTE.ISENTO_ENCARGOS = 'S' THEN"
      - arquivo: db/01_tabelas.sql
        linha_inicial: 13
        linha_final: 14
        trecho: "ISENTO_ENCARGOS"
      - arquivo: cobol/CALCOBR.cbl
        linha_inicial: 69
        linha_final: 69
