# Ciclo de publicação da documentação (#279): o item `analise` é analisado,
# aprovado e publicado no repositório de docs `repositorio` (na avaliação, um
# repositório bare local, sem forja real); o item `reanalise` é analisado de
# novo numa base nova, que só tem a documentação publicada, sincronizada do
# repositório. A segunda análise é comparada com o gabarito como nos outros
# fluxos e, à parte, confere-se que o agente consultou a documentação publicada
# (`conhecimento` com `externos`) e citou a fonte.
